name: codeql

# GitHub's static security analysis. Catches injection, unsafe deserialization,
# hardcoded secret patterns, etc. — complements bandit (which we already run on
# every PR) by going deeper at the cost of a slower job.
#
# Findings appear in the repo's Security → Code scanning tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Sundays at 09:00 UTC, before the Monday `security-weekly.yml` audit.
    # Re-running on a schedule catches new CodeQL queries even when no code changed.
    - cron: "0 9 * * 0"

# Treat each scan independently — cancelling in-flight ones is fine for analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required for actions/checkout on private repos via checkout@v4+.
      contents: read
      # Required for CodeQL to identify packages.
      packages: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-extended` adds queries beyond the default, including
          # weak crypto and unsafe-yaml patterns. `security-and-quality` would
          # add maintainability checks; we already run ruff + mypy for those.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Run on PRs targeting ANY branch so stacked PRs (whose base is
    # another open PR's branch, not `main`) still get CI coverage.
    # Without this, PRs created with `--base feat/some-branch` never
    # trigger the workflow until they're rebased onto main, leaving
    # the stack unverified by GitHub Actions even when local checks
    # pass. See audit 2026-05-04 — at one point 10 stacked PRs had
    # zero CI runs because of this trigger gap.
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Matrix over both host OSes: the always-on production box is Windows, so a
    # Windows-only breakage (path separators, missing `bash`, CRLF) must not be
    # able to merge green. `fail-fast: false` so one OS failing still reports
    # the other instead of cancelling it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Keep this literal in sync with `.python-version` at the repo root; the
      # "Verify pinned interpreter" step below fails the build if they diverge.
      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      # `requires-python = ">=3.12"` has no upper bound, so without this guard a
      # host can silently resolve a newer interpreter than CI ever exercised.
      # Written as a single `python -c` so it parses under both bash and pwsh.
      - name: Verify pinned interpreter
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/kq

      - name: Test (with coverage gate; threshold in pyproject.toml)
        run: uv run pytest -m "not integration" --cov=src/kq --cov-report=term-missing --cov-report=xml

      # Both matrix legs run the coverage gate (the OS-skipped tests cover no
      # `src/kq` lines, so the threshold behaves identically), but only the
      # ubuntu leg publishes — two legs uploading would collide on the artifact
      # name and double-report to Codecov.
      - name: Upload coverage artifact
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        # The action handles a missing token gracefully when fail_ci_if_error
        # is false — it logs a warning and the job stays green. So we don't
        # need a custom `if:` guard. (Previous attempt at one was broken: a
        # step's own `env:` block isn't visible to its own `if:` expression.)
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          flags: unit
          slug: jaloo8/forecast-lab

  security:
    # Quick same-PR security gate. Heavy weekly scan lives in security-weekly.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Bandit (static security scan)
        run: uv run bandit -c pyproject.toml -r src/kq -ll

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/kq

      - name: Test (with coverage gate; threshold in pyproject.toml)
        run: uv run pytest -m "not integration" --cov=src/kq --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        # The action handles a missing token gracefully when fail_ci_if_error
        # is false — it logs a warning and the job stays green. So we don't
        # need a custom `if:` guard. (Previous attempt at one was broken: a
        # step's own `env:` block isn't visible to its own `if:` expression.)
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
          flags: unit
          slug: jaloo8/forecast-lab

  security:
    # Quick same-PR security gate. Heavy weekly scan lives in security-weekly.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --all-extras --dev

      - name: Bandit (static security scan)
        run: uv run bandit -c pyproject.toml -r src/kq -ll

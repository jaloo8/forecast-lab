[project]
name = "forecast-lab"
version = "0.0.1"
description = "Personal research lab for probabilistic forecasting and prediction-market analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
authors = [{ name = "JL" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",

    # Storage / data
    "duckdb>=1.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",

    # Weather
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",

    # NBA
    "nba-api>=1.5",

    # Kalshi
    "cryptography>=43.0",  # for RSA-PSS signing

    # Modeling / stats
    "scikit-learn>=1.5",
    "properscoring>=0.1",
    "numpy>=1.26",
    "scipy>=1.13",

    # Dashboard
    "streamlit>=1.37",
    "altair>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ipython>=8.26",
    "jupyter>=1.0",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kq"]

# -------- ruff --------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PL",      # pylint
    "TID",     # tidy imports
]
ignore = [
    "PLR0913",  # too many arguments; models legitimately have many
    "PLR2004",  # magic value; common in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"notebooks/**" = ["E402", "F401", "F811"]

# -------- mypy --------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nba_api.*", "openmeteo_requests.*", "properscoring.*"]
ignore_missing_imports = true

# -------- pytest --------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real external APIs (skipped in CI by default)",
    "slow: tests that take > 5s",
]

# -------- coverage --------
[tool.coverage.run]
source = ["src/kq"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[project]
name = "forecast-lab"
version = "0.0.1"
description = "Personal research lab for probabilistic forecasting and prediction-market analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - all rights reserved" }
authors = [{ name = "JL" }]

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
    # Storage / data
    "duckdb>=1.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    # Weather
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    # NBA
    "nba-api>=1.5",
    # Kalshi
    "cryptography>=43.0",  # for RSA-PSS signing
    # Modeling / stats
    "scikit-learn>=1.5",
    "properscoring>=0.1",
    "numpy>=1.26",
    "scipy>=1.13",
    # Dashboard
    "streamlit>=1.37",
    "altair>=5.3",
    # GEFSv12 reforecast ingest (Phase 2 ext #6) — GRIB2 byte-range fetcher
    # + xarray subset extraction at station coordinates. eccodeslib bundles
    # the libeccodes C library so no system-level brew/apt install needed.
    # No Windows wheels exist for eccodeslib — GRIB2 ingest paths are
    # Mac/WSL2-only; all imports are lazy so the rest of the package works
    # on native Windows (tests patch xarray.open_dataset, never load eccodes).
    "cfgrib>=0.9.15.1",
    "xarray>=2026.4.0",
    "eccodeslib>=2.46.2.19; sys_platform != 'win32'",
    "nfl-data-py>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ipython>=8.26",
    "jupyter>=1.0",
    "types-requests>=2.32",
    "bandit>=1.9",
    "pip-audit>=2.7",
    "mutmut>=3.2",
]

[project.scripts]
# `uv run kq ...` == `uv run python -m kq ...` — one short launcher everywhere.
kq = "kq.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kq"]

# -------- ruff --------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # simplify
    "RUF",     # ruff-specific
    "PL",      # pylint
    "TID",     # tidy imports
]
ignore = [
    "PLR0913",  # too many arguments; models legitimately have many
    "PLR2004",  # magic value; common in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"notebooks/**" = ["E402", "F401", "F811"]

# -------- mypy --------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "nba_api.*",
    "openmeteo_requests.*",
    "properscoring.*",
    "scipy.*",
    "sklearn.*",
    "cfgrib.*",
    "xarray.*",
    "eccodes.*",
    "eccodeslib.*",
    "nfl_data_py.*",
    # pandas-stubs is heavyweight + dev-only; the dashboard is the only
    # consumer and uses pandas.DataFrame at the boundary, no internals.
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

# -------- pytest --------
[tool.pytest.ini_options]
minversion = "8.0"
# `-m "not integration"` so the default `pytest` invocation skips real-API tests;
# CI also passes the same flag explicitly.
addopts = "-ra -q --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that hit real external APIs (opt in with -m integration)",
    "slow: tests that take > 5s",
]

# -------- coverage --------
[tool.coverage.run]
source = ["src/kq"]
branch = true

[tool.coverage.report]
# Threshold enforced by CI; see docs/CODE_QUALITY.md for the audit breakdown.
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# -------- mutmut (mutation testing) --------
# Scoped to the pure-function money path — the sizing/fee math where a
# silently-wrong operator does real damage. Each module has a dedicated,
# fast unit test, so `tests_dir` is pinned to just those files: every
# mutant's test run stays sub-second and the whole pass is bounded.
# Run: `uv run mutmut run` then `uv run mutmut results`. See docs/TESTING.md.
[tool.mutmut]
paths_to_mutate = [
    "src/kq/execution/fees.py",
    "src/kq/execution/kelly.py",
    "src/kq/execution/maker_taker.py",
    "src/kq/execution/robust_kelly.py",
]
tests_dir = [
    "tests/test_fees.py",
    "tests/test_kelly.py",
    "tests/test_maker_taker.py",
    "tests/test_robust_kelly.py",
]

# -------- bandit --------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# Globally suppressed:
#   B311 — random.uniform for retry-jitter, not crypto.
#   B608 — f-string SQL only used in features/weather.py; the interpolated
#          `where` is built solely from `?` placeholders by _build_where(),
#          user values flow through `params` not via f-string. Inline
#          `# nosec B608` doesn't reliably attach to multi-line triple-quoted
#          strings across bandit versions, so we suppress at config level.
# B403/B101 are addressed inline with `# nosec`/code fixes — see docs/CODE_QUALITY.md.
skips = ["B311", "B608"]
